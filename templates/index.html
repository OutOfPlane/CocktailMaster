{% extends "base.html" %}
{% block content %}
<h2>Select a Drink</h2>
<div class="recipe-grid">
    {% for recipe in recipes %}
    <div class="recipe-card" onclick="confirmStart('{{ recipe.id }}', '{{ recipe.name }}')">
        <h3>{{ recipe.name }}</h3>
        <p><strong>Glass:</strong> {{ recipe.glass }}</p>
        <small>{{ recipe.ingredients|length }} ingredients</small>
    </div>
    {% endfor %}
</div>

<script>
function confirmStart(id, name) {
    if (confirm(`Do you want to start mixing a ${name}?`)) {
        window.location.href = `/mix/${id}`;
    }
}
</script>
{% endblock %}
