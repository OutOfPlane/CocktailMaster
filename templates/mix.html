{% extends "base.html" %}
{% block content %}
<div class="mix-container">
    <h2>Mixing: {{ recipe.name }}</h2>
    <div class="split-screen-container">

        <div class="image-panel">
            <img id="ingredient-image" src="{{ recipe.image }}" alt="Current Step Image">
        </div>

        <div id="instruction-box" class="instruction-card" data-state="pouring">
            <h3 id="step-title">Step 1: Place Glass</h3>
            <p id="step-instruction">Please place the required glass on the scale: <strong>{{ recipe.glass
                    }}</strong></p>

            <div class="weight-display">
                <span id="current-weight">0.0</span>ml
                <span id="scale-status" class="status-badge">ruhig</span>
            </div>

            <button id="next-btn" onclick="nextStep()">Glas platziert.</button>
        </div>

    </div>
</div>

<script>
    const recipe = {{ recipe | tojson | safe }};

    let currentStep = -1; // -1 = Glass check, 0+ = Ingredients
    let tareWeight = 0;
    let currentGrams = 0;
    let isStable = false;

    setInterval(async () => {
        try {
            const res = await fetch('http://localhost:8003/weight');
            const data = await res.json();

            currentGrams = data.grams;
            isStable = data.stable;

            // Calculate weight to show
            const pouredAmount = currentStep === -1 ? currentGrams : (currentGrams - tareWeight);
            document.getElementById('current-weight').innerText = Math.max(0, pouredAmount).toFixed(1);

            // Update scale stability badge
            const statusBadge = document.getElementById('scale-status');
            statusBadge.innerText = isStable ? "Ruhig" : "Gießen...";
            statusBadge.style.backgroundColor = isStable ? "rgba(46, 196, 182, 0.3)" : "rgba(231, 29, 54, 0.3)";

            // Handle progress background if we are on an ingredient step
            if (currentStep >= 0 && currentStep < recipe.ingredients.length) {
                const target = recipe.ingredients[currentStep].amount;
                const box = document.getElementById('instruction-box');

                // Calculate percentage (capped between 0% and 100%)
                const percentage = Math.min(Math.max((pouredAmount / target) * 100, 0), 100);

                if (pouredAmount >= target) {
                    // Target hit and settled -> Turn full solid green
                    box.setAttribute('data-state', 'success');
                    box.style.background = "#2ec4b6";

                    const btn = document.getElementById('next-btn');
                    btn.disabled = false;
                    btn.innerText = "Weiter zum nächsten Schritt";
                } else {
                    // Still pouring -> Update fluid fill from bottom to top
                    box.setAttribute('data-state', 'pouring');

                    // Creates an upward filling effect using a linear gradient
                    box.style.background = `linear-gradient(to top, #aaaaaa ${percentage}%, #112a46 ${percentage}%)`;

                    // Fallback button state if they overpour or scale becomes unstable again
                    const btn = document.getElementById('next-btn');
                    if (pouredAmount < target) {
                        btn.disabled = true;
                        btn.innerText = `Bitte füllen (${target}ml)...`;
                    }
                }
            }
        } catch (e) {
            console.error("Scale read error:", e);
        }
    }, 200);

    function nextStep() {
        const box = document.getElementById('instruction-box');
        

        if (currentStep === -1) {
            tareWeight = currentGrams;
            currentStep = 0;
            updatePourUI();
        } else {
            tareWeight = currentGrams;
            currentStep++;
            if (currentStep < recipe.ingredients.length) {
                updatePourUI();
            } else {
                // All finished
                box.setAttribute('data-state', 'done');
                box.style.background = "#ff9f1c";
                box.innerHTML = `
                    <h3 style="color:#011627;">Cheers! 🎉</h3>
                    <p style="color:#011627;">Your ${recipe.name} is complete. Enjoy your drink!</p>
                    <a href="/" class="btn" style="text-decoration:none; display:inline-block; margin-top:20px; background:#011627; padding:10px 20px; color:white; border-radius:5px; font-weight:bold;">Mix Another</a>
                `;
            }
        }
    }

    function updatePourUI() {
        const ingredient = recipe.ingredients[currentStep];
        const box = document.getElementById('instruction-box');
        const ingr_img = document.getElementById('ingredient-image');

        ingr_img.src = ingredient.image;

        // Reset background to 0% filled for the new ingredient
        box.style.background = `linear-gradient(to top, #1e3a5f 0%, #112a46 0%)`;

        document.getElementById('step-title').innerText = `Pour: ${ingredient.name}`;
        document.getElementById('step-instruction').innerText = `Slowly pour ${ingredient.name} until you hit ${ingredient.amount}g.`;

        const btn = document.getElementById('next-btn');
        btn.disabled = true;
        btn.innerText = `Bitte füllen (${ingredient.amount}ml)...`;
    }
</script>
{% endblock %}
