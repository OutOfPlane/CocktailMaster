{% extends "base.html" %}
{% block content %}
<div class="mix-container">
    <h2>{{ recipe.name }} mixen</h2>
    <div class="split-screen-container">

        <div class="image-panel">
            <img id="ingredient-image" src="{{ recipe.image }}" alt="">
        </div>

        <div id="instruction-box" class="instruction-card" data-state="glass">
            <div class="instruction-body">
                <h3 id="step-title">Schritt 1: Glas platzieren</h3>
                <p id="step-instruction">Stelle das <strong>{{ recipe.glass }}</strong>-Glas auf die Waage.</p>

                <div class="weight-display">
                    <span id="weight-readout">0 ml</span>
                    <span id="scale-status" class="status-badge">ruhig</span>
                </div>
            </div>

            <div class="instruction-actions">
                <button id="next-btn" onclick="nextStep()">Glas steht bereit</button>
                <button id="skip-btn" class="skip-btn" onclick="nextStep()">Überspringen &rarr;</button>
            </div>
        </div>

    </div>
</div>

<script>
    const recipe = {{ recipe | tojson | safe }};

    let currentStep = -1; // -1 = Glass check, 0+ = Ingredients
    let tareWeight = 0;
    let currentGrams = 0;
    let isStable = false;
    let autoDeadline = null;              // timestamp to auto-continue, or null when disarmed

    const AUTO_CONTINUE_MS = 3000;        // wait once the target is settled
    const AUTO_CONTINUE_THRESHOLD = 0.95; // fraction of target that counts as "reached"

    const box = document.getElementById('instruction-box');

    function setState(state) {
        box.setAttribute('data-state', state);
    }

    setInterval(async () => {
        if (box.dataset.state === 'done') return; // recipe finished, stop polling
        try {
            const res = await fetch('http://localhost:8003/weight');
            const data = await res.json();

            currentGrams = data.grams;
            isStable = data.stable;

            const pouredAmount = currentStep === -1 ? currentGrams : (currentGrams - tareWeight);
            const current = Math.round(Math.max(0, pouredAmount));
            const readout = document.getElementById('weight-readout');

            const statusBadge = document.getElementById('scale-status');
            statusBadge.innerText = isStable ? "Ruhig" : "Gießen...";
            statusBadge.classList.toggle('is-stable', isStable);

            // Progress fill while on an ingredient step
            if (currentStep >= 0 && currentStep < recipe.ingredients.length) {
                const target = recipe.ingredients[currentStep].amount;
                const percentage = Math.min(Math.max((pouredAmount / target) * 100, 0), 100);
                const btn = document.getElementById('next-btn');

                readout.innerHTML = `<span class="num">${current}</span> ml / ${target} ml`;

                if (pouredAmount >= target * AUTO_CONTINUE_THRESHOLD) {
                    setState('success');
                    btn.disabled = false;

                    if (isStable) {
                        // Target settled -> run the 3s auto-continue countdown.
                        if (autoDeadline === null) autoDeadline = Date.now() + AUTO_CONTINUE_MS;
                        const remainingMs = autoDeadline - Date.now();
                        if (remainingMs <= 0) {
                            autoDeadline = null;
                            nextStep();
                            return;
                        }
                        btn.innerText = `Weiter in ${Math.ceil(remainingMs / 1000)}…`;
                    } else {
                        // Not settled yet -> pause the countdown, allow manual continue.
                        autoDeadline = null;
                        btn.innerText = "Weiter →";
                    }
                } else {
                    autoDeadline = null;
                    setState('pouring');
                    box.style.setProperty('--fill', percentage + '%');
                    btn.disabled = true;
                    btn.innerText = "Bitte einfüllen…";
                }
            } else {
                readout.innerHTML = `<span class="num">${current}</span> ml`;
            }
        } catch (e) {
            console.error("Scale read error:", e);
        }
    }, 200);

    function nextStep() {
        autoDeadline = null; // cancel any pending auto-continue
        if (currentStep === -1) {
            tareWeight = currentGrams;
            currentStep = 0;
            updatePourUI();
        } else {
            tareWeight = currentGrams;
            currentStep++;
            if (currentStep < recipe.ingredients.length) {
                updatePourUI();
            } else {
                finish();
            }
        }
    }

    function updatePourUI() {
        const ingredient = recipe.ingredients[currentStep];
        const ingr_img = document.getElementById('ingredient-image');

        ingr_img.src = ingredient.image;
        setState('pouring');
        box.style.setProperty('--fill', '0%');

        document.getElementById('step-title').innerText = `Eingießen: ${ingredient.name}`;
        document.getElementById('step-instruction').innerText =
            `Gieße ${ingredient.name} langsam ein, bis ${ingredient.amount} ml erreicht sind.`;
        document.getElementById('weight-readout').innerHTML = `<span class="num">0</span> ml / ${ingredient.amount} ml`;

        const btn = document.getElementById('next-btn');
        btn.disabled = true;
        btn.innerText = "Bitte einfüllen…";
    }

    function finish() {
        setState('done');
        box.innerHTML = `
            <div class="done-screen">
                <h3>Fertig! 🎉</h3>
                <p>Dein ${recipe.name} ist bereit. Zum Wohl!</p>
                <a href="/" class="mix-again">Neuen Drink mixen</a>
            </div>
        `;
    }
</script>
{% endblock %}
