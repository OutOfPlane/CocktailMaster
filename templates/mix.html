{% extends "base.html" %}
{% block content %}
<div class="mix-container">
    <h2>Mixing: {{ recipe.name }}</h2>
    
    <div id="instruction-box" class="instruction-card">
        <h3 id="step-title">Step 1: Place Glass</h3>
        <p id="step-instruction">Please place the required glass on the scale: <strong>{{ recipe.glass }}</strong></p>
        
        <div class="weight-display">
            <span id="current-weight">0.0</span>g 
            <span id="scale-status" class="status-badge">Unstable</span>
        </div>

        <button id="next-btn" onclick="nextStep()">Confirm Glass is Placed</button>
    </div>
</div>

<script>
    // Inject recipe data safely from Jinja2 to JS
    const recipe = {{ recipe | tojson | safe }};
    
    let currentStep = -1; // -1 means "Waiting for glass"
    let tareWeight = 0;
    let targetWeightForStep = 0;
    let currentGrams = 0;
    let isStable = false;

    // Periodically fetch scale data (every 200ms)
    setInterval(async () => {
        try {
            const res = await fetch('http://localhost:8003/weight');
            const data = await res.json();
            
            currentGrams = data.grams;
            isStable = data.stable;

            // Update UI Weight Display
            const displayWeight = currentStep === -1 ? currentGrams : (currentGrams - tareWeight);
            document.getElementById('current-weight').innerText = displayWeight.toFixed(1);
            
            const statusBadge = document.getElementById('scale-status');
            statusBadge.innerText = isStable ? "Stable" : "Adjusting...";
            statusBadge.style.backgroundColor = isStable ? "#2ec4b6" : "#e71d36";

            // Live updates while pouring an ingredient
            if (currentStep >= 0 && currentStep < recipe.ingredients.length) {
                const pouredAmount = currentGrams - tareWeight;
                const target = recipe.ingredients[currentStep].amount;
                
                if (pouredAmount >= target && isStable) {
                    document.getElementById('next-btn').disabled = false;
                    document.getElementById('next-btn').innerText = "Step Complete! Next ->";
                }
            }
        } catch (e) {
            console.error("Failed to read scale data", e);
        }
    }, 200);

    function nextStep() {
        if (currentStep === -1) {
            // Glass is placed. Tare the scale to current weight.
            tareWeight = currentGrams;
            currentStep = 0;
            updatePourUI();
        } else {
            // Advance ingredient step, tare to new baseline
            tareWeight = currentGrams; 
            currentStep++;
            if (currentStep < recipe.ingredients.length) {
                updatePourUI();
            } else {
                // Finished!
                document.getElementById('instruction-box').innerHTML = `
                    <h3>Cheers! 🎉</h3>
                    <p>Your ${recipe.name} is complete. Enjoy your drink!</p>
                    <a href="/" class="btn" style="text-decoration:none; display:inline-block; margin-top:20px; background:#ff9f1c; padding:10px 20px; color:white; border-radius:5px;">Mix Another</a>
                `;
            }
        }
    }

    function updatePourUI() {
        const ingredient = recipe.ingredients[currentStep];
        document.getElementById('step-title').innerText = `Pour: ${ingredient.name}`;
        document.getElementById('step-instruction').innerText = `Slowly pour ${ingredient.name} until you hit ${ingredient.amount}g.`;
        
        const btn = document.getElementById('next-btn');
        btn.disabled = true;
        btn.innerText = `Waiting for target (${ingredient.amount}g)...`;
    }
</script>
{% endblock %}
